# ==============================================================================
# Codemagic CI/CD Configuration for Omnia Flutter App
# Package: my.com.omniafoodsupply.shop
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. Android Release Build & Publishing
  # ----------------------------------------------------------------------------
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - android_signing
        - firebase_credentials
      vars:
        PACKAGE_NAME: "my.com.omniafoodsupply.shop"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up Firebase credentials
        script: |
          if [ -n "$FIREBASE_OPTIONS_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
            echo "lib/firebase_options.dart generated."
          fi
          if [ -n "$ANDROID_GOOGLE_SERVICES_BASE64" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
            echo "android/app/google-services.json generated."
          fi
      - name: Set up Android Keystore
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
            echo "keystore.properties setup..."
            cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "CM_KEYSTORE is not set. Building unsigned or with default debug key."
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle (AAB) & Universal APK
        script: |
          # Build .aab for Google Play Store upload
          flutter build appbundle --release
          
          # Build .apk for direct testing on physical Android devices
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - admin@omniafoodsupply.com.my
        notify:
          failure: true
          success: true
      # Uncomment after adding GCLOUD_SERVICE_ACCOUNT_KEY in Codemagic
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_KEY
      #   track: internal

  # ----------------------------------------------------------------------------
  # 2. iOS Release Build & TestFlight Publishing
  # ----------------------------------------------------------------------------
  ios-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Uncomment 'integrations' after adding your Apple API key in Codemagic Settings > Integrations:
    # integrations:
    #   app_store_connect: omnia_app_store_connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        BUNDLE_ID: "my.com.omniafoodsupply.shop"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up Firebase credentials
        script: |
          if [ -n "$FIREBASE_OPTIONS_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
            echo "lib/firebase_options.dart generated."
          fi
          if [ -n "$IOS_GOOGLE_SERVICES_BASE64" ]; then
            echo "$IOS_GOOGLE_SERVICES_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "ios/Runner/GoogleService-Info.plist generated."
          fi
      - name: Install dependencies & CocoaPods
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Set up code signing on Xcode project
        script: |
          # If Apple Developer integration is active, use profiles:
          which xcode-project && xcode-project use-profiles || echo "Skipping profile setup until Apple key is connected"
      - name: Build iOS IPA
        script: |
          # If code signing is configured, build signed ipa, otherwise build unsigned:
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - admin@omniafoodsupply.com.my
        notify:
          failure: true
          success: true
      # Uncomment after connecting Apple integration:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   expire_build_submitted_for_testing: false
